services:
  app_proxy:
    environment:
      APP_HOST: aalfath-ubuntu-desktop_tls-bridge_1
      APP_PORT: "8080"
      # KasmVNC provides its own login using the credentials in the manifest.
      PROXY_AUTH_ADD: "false"

  volume-init:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    user: "0:0"
    command:
      - /bin/sh
      - -c
      - >-
        mkdir -p /data/home &&
        chown 1000:0 /data /data/home &&
        chmod 0775 /data /data/home &&
        printf '%s\n' 'kasm-user ALL=(ALL:ALL) NOPASSWD: ALL' > /sudoers.d/umbrel-kasm-user &&
        chown 0:0 /sudoers.d/umbrel-kasm-user &&
        chmod 0440 /sudoers.d/umbrel-kasm-user
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/sudoers.d:/sudoers.d
    restart: "no"

  desktop:
    image: kasmweb/ubuntu-jammy-desktop:1.18.0@sha256:b45005715f762b34d7868c57c32316a0117eb1358c90c64dbbcbe30c136095b5
    shm_size: "1gb"
    security_opt:
      # Electron apps such as ChatGPT need to create an unprivileged user
      # namespace for their own Chromium sandbox. Docker's default seccomp and
      # AppArmor policies block that operation inside a container.
      - seccomp=/usr/share/containers/seccomp.json
      - apparmor=unconfined
    environment:
      VNC_PW: "${APP_PASSWORD}"
      TZ: "${TZ:-Etc/UTC}"
    volumes:
      - ${APP_DATA_DIR}/data/home:/home/kasm-user
      - ${APP_DATA_DIR}/sudoers.d:/etc/sudoers.d:ro
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl --fail --insecure --silent --output /dev/null --user "kasm_user:$${VNC_PW}" https://127.0.0.1:6901/'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: on-failure

  tls-bridge:
    image: nginx:1.29.1-alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    volumes:
      - ${APP_DATA_DIR}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      desktop:
        condition: service_healthy
    restart: on-failure
