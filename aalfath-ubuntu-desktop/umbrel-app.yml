manifestVersion: 1
id: aalfath-ubuntu-desktop
name: Ubuntu Desktop
tagline: A persistent Ubuntu desktop in your browser, powered by KasmVNC
icon: https://raw.githubusercontent.com/aalfath/umbrel-ubuntu-desktop-app-store/main/aalfath-ubuntu-desktop/icon.svg
category: files & productivity
version: "1.18.0-4"
port: 3390
description: >-
  A full Ubuntu Jammy desktop that runs persistently on your Umbrel and is
  available from any modern browser through KasmVNC. Your home directory,
  settings, documents, downloads, and installed per-user applications survive
  container restarts and app updates.


  Sign in as kasm_user with the per-app password shown by umbrelOS. KasmVNC
  provides responsive browser access, clipboard integration, uploads,
  downloads, and audio support. The kasm-user Linux account has passwordless
  sudo inside the desktop container. The container remains non-privileged and
  does not mount Umbrel's Docker socket or host filesystem. To support the
  Chromium sandbox used by Electron applications such as ChatGPT, the desktop
  uses umbrelOS's host-provided OCI seccomp allowlist, which permits
  user-namespace creation, and runs without Docker's outer AppArmor profile.


  This app is intended for trusted local networks or access through a private
  VPN. Do not forward its port directly to the public internet. The image is
  large (approximately 4 GB compressed), so the first installation can take
  several minutes and requires sufficient free storage.
developer: Kasm Technologies
website: https://www.kasmweb.com/
submitter: aalfath
submission: https://github.com/aalfath/umbrel-ubuntu-desktop-app-store
repo: https://github.com/kasmtech/workspaces-images
support: https://github.com/aalfath/umbrel-ubuntu-desktop-app-store/issues
gallery: []
releaseNotes: >-
  Fixes the "No usable sandbox" crash in Chromium/Electron applications such
  as ChatGPT. The desktop now permits unprivileged user namespaces through a
  host-provided OCI seccomp allowlist. Docker's per-container AppArmor profile
  is disabled because it otherwise blocks the same namespace operation. This
  patch also fixes in-place updates from older app versions; the container
  remains non-privileged with no Docker socket or host mounts.
dependencies: []
path: ""
defaultUsername: "kasm_user"
deterministicPassword: true
